name: ci

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: ascenta_test
          MYSQL_USER: ascenta
          MYSQL_PASSWORD: ascenta-test-only
          MYSQL_ROOT_PASSWORD: root-test-only
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot-test-only"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      NODE_ENV: test
      DATA_MODE: mysql
      DATABASE_URL: mysql://ascenta:ascenta-test-only@127.0.0.1:3306/ascenta_test
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 3306
      DATABASE_USER: ascenta
      DATABASE_PASSWORD: ascenta-test-only
      DATABASE_NAME: ascenta_test
      TEST_DATABASE_URL: mysql://ascenta:ascenta-test-only@127.0.0.1:3306/ascenta_test
      WEB_ORIGIN: http://localhost:5175
      VITE_API_BASE_URL: http://localhost:4000/api/v1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - run: pnpm db:migrate:deploy
      - run: pnpm db:seed
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:e2e
      - run: pnpm build
      - run: pnpm test:migration
      - run: pnpm test:visual:reference
