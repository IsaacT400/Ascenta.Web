services:
  mysql:
    image: mysql:8.4
    container_name: ascenta-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ascenta_dev}
      MYSQL_USER: ${MYSQL_USER:-ascenta}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me-local-only}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-root-local-only}
    ports:
      - "3306:3306"
    volumes:
      - ascenta_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-change-me-root-local-only}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]

volumes:
  ascenta_mysql_data:
